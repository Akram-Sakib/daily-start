<!doctype html>
<html lang="en" data-theme="paper">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; connect-src 'none'"
    />
    <title>Daily Start</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- icon sprite: one place to edit the line art -->
    <svg class="sprite" aria-hidden="true">
      <defs>
        <g id="i-sun">
          <circle cx="12" cy="12" r="4.2" />
          <path d="M12 2.4v2.4M12 19.2v2.4M4.4 12H2M22 12h-2.4M6.3 6.3 4.6 4.6M19.4 19.4l-1.7-1.7M17.7 6.3l1.7-1.7M4.6 19.4l1.7-1.7" />
        </g>
        <g id="i-sunset">
          <path d="M3 19.5h18" />
          <path d="M7 19.5a5 5 0 0 1 10 0" />
          <path d="M12 3.5v3M5.6 8.1l1.9 1.9M18.4 8.1l-1.9 1.9" />
        </g>
        <g id="i-moon">
          <path d="M20.5 15.2A8.6 8.6 0 0 1 9.2 3.9a7.4 7.4 0 1 0 11.3 11.3z" />
        </g>
        <g id="i-contrast">
          <circle cx="12" cy="12" r="8.4" />
          <path d="M12 3.6a8.4 8.4 0 0 0 0 16.8z" fill="currentColor" stroke="none" />
        </g>
        <g id="i-gear">
          <circle cx="12" cy="12" r="3.1" />
          <path d="M18.9 14.6a1.6 1.6 0 0 0 .3 1.8l.1.1a1.9 1.9 0 1 1-2.7 2.7l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5v.2a1.9 1.9 0 1 1-3.8 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a1.9 1.9 0 1 1-2.7-2.7l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1h-.2a1.9 1.9 0 1 1 0-3.8h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a1.9 1.9 0 1 1 2.7-2.7l.1.1a1.6 1.6 0 0 0 1.8.3h.1a1.6 1.6 0 0 0 1-1.5v-.2a1.9 1.9 0 1 1 3.8 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a1.9 1.9 0 1 1 2.7 2.7l-.1.1a1.6 1.6 0 0 0-.3 1.8v.1a1.6 1.6 0 0 0 1.5 1h.2a1.9 1.9 0 1 1 0 3.8h-.2a1.6 1.6 0 0 0-1.5 1z" />
        </g>
        <g id="i-check"><path d="M5 12.6 9.5 17 19 7.6" /></g>
        <g id="i-dot"><circle cx="12" cy="12" r="4.6" /></g>
        <g id="i-minus"><path d="M5 12h14" /></g>
        <g id="i-x"><path d="M6 6l12 12M18 6 6 18" /></g>
        <g id="i-left"><path d="M14.5 5.5 8 12l6.5 6.5" /></g>
        <g id="i-right"><path d="M9.5 5.5 16 12l-6.5 6.5" /></g>
        <g id="i-flame">
          <path d="M12 21c-3.4 0-6-2.5-6-5.7 0-2.5 1.4-4.4 2.9-6.1C10.5 7.4 12 5.5 12 3c0 0 6 4.3 6 12.3 0 3.2-2.6 5.7-6 5.7z" />
        </g>
      </defs>
    </svg>

    <!-- custom titlebar (window is frameless) -->
    <header class="titlebar">
      <div class="drag"><span class="brand">Daily&nbsp;Start</span></div>
      <div class="win-actions">
        <button id="btn-theme" class="icon-btn" title="Switch theme" aria-label="Switch theme">
          <svg viewBox="0 0 24 24"><use href="#i-contrast" /></svg>
        </button>
        <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24"><use href="#i-gear" /></svg>
        </button>
        <button id="btn-min" class="icon-btn" title="Minimise — stays owed, nothing pops up" aria-label="Minimise">
          <svg viewBox="0 0 24 24"><use href="#i-minus" /></svg>
        </button>
        <button id="btn-close" class="icon-btn danger" title="Dismiss for today — it won't reopen on its own" aria-label="Dismiss for today">
          <svg viewBox="0 0 24 24"><use href="#i-x" /></svg>
        </button>
      </div>
    </header>

    <main class="sheet">
      <!-- ---------------- greeting ---------------- -->
      <section class="hero">
        <div class="hero-row">
          <svg id="hero-icon" class="hero-icon" viewBox="0 0 24 24"><use href="#i-sun" /></svg>
          <h1 id="greeting">Good Morning</h1>
        </div>
        <p id="date-line" class="date-line">&nbsp;</p>
        <p id="streak-line" class="streak-line"></p>
      </section>

      <nav class="tabs" role="tablist">
        <button class="tab is-active" data-view="today" role="tab">Today</button>
        <button class="tab" data-view="week" role="tab">Week</button>
        <button class="tab" data-view="month" role="tab">Month</button>
        <button class="tab" data-view="year" role="tab">Year</button>
      </nav>

      <!-- ---------------- today ---------------- -->
      <section id="view-today" class="view">
        <div class="progress">
          <div class="progress-head">
            <span id="progress-label" class="progress-label">&nbsp;</span>
            <span id="progress-pct" class="progress-pct"></span>
          </div>
          <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
        </div>

        <h2 class="section-title">Today</h2>
        <ul id="today-list" class="task-list"></ul>

        <form id="add-form" class="add-row" autocomplete="off">
          <span class="add-plus">+</span>
          <input
            id="add-input"
            class="add-input"
            type="text"
            maxlength="120"
            placeholder="Add something for today…"
            aria-label="Add a task for today"
          />
        </form>

        <div id="recap-block" class="recap-block hidden">
          <h2 class="section-title" id="recap-title">Yesterday</h2>
          <ul id="recap-list" class="task-list recap"></ul>
        </div>
      </section>

      <!-- ------------- week / month / year ------------- -->
      <section id="view-stats" class="view hidden">
        <div class="period">
          <button id="per-prev" class="per-btn" aria-label="Previous period">
            <svg viewBox="0 0 24 24"><use href="#i-left" /></svg>
          </button>
          <span id="per-label" class="per-label">—</span>
          <button id="per-next" class="per-btn" aria-label="Next period">
            <svg viewBox="0 0 24 24"><use href="#i-right" /></svg>
          </button>
        </div>

        <div class="stat-row" id="stat-tiles"></div>

        <h2 class="section-title" id="chart-title">Activity</h2>
        <p class="chart-caption" id="chart-caption"></p>
        <div id="chart-host"></div>

        <h2 class="section-title">Task breakdown</h2>
        <p class="chart-caption" id="rank-caption"></p>
        <div id="rank-host" class="rank-list"></div>

        <details class="table-wrap">
          <summary>Show as table</summary>
          <table class="data-table">
            <thead>
              <tr><th>Task</th><th>Done</th><th>Days</th><th>Rate</th></tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </details>
      </section>
    </main>

    <footer class="footer">
      <button id="btn-start" class="start-btn">Start My Day</button>
      <p id="footer-hint" class="footer-hint">&nbsp;</p>
    </footer>

    <!-- ---------------- settings ---------------- -->
    <div id="settings-panel" class="overlay hidden">
      <div class="panel">
        <div class="panel-head">
          <h2>Settings</h2>
          <button id="btn-settings-close" class="icon-btn" aria-label="Close settings">
            <svg viewBox="0 0 24 24"><use href="#i-x" /></svg>
          </button>
        </div>

        <label class="field">
          <span class="field-label">Your name</span>
          <input id="set-name" type="text" maxlength="40" class="text-input" />
        </label>

        <label class="field">
          <span class="field-label">Daily routine — one per line</span>
          <textarea id="set-routines" rows="6" class="text-input mono"></textarea>
          <span class="field-hint">This list rebuilds your checklist every morning.</span>
        </label>

        <label class="switch-row">
          <input id="set-autolaunch" type="checkbox" />
          <span>
            <strong>Open when Windows starts</strong>
            <em>Shows up once each morning, then stays out of the way.</em>
          </span>
        </label>

        <div class="sub-block">
          <label class="switch-row">
            <input id="set-morning" type="checkbox" />
            <span>
              <strong>Not before a set time</strong>
              <em>Otherwise it appears as soon as you turn the PC on, whatever the hour.</em>
            </span>
          </label>
          <div id="morning-time-row" class="time-row">
            <label class="field-label" for="set-morning-time">Open from</label>
            <input id="set-morning-time" type="time" class="text-input time-input" value="08:00" />
          </div>
        </div>

        <div class="sub-block">
          <label class="switch-row">
            <input id="set-evening" type="checkbox" />
            <span>
              <strong>Evening check-in</strong>
              <em>Opens once more at night so you can tick off what happened.</em>
            </span>
          </label>
          <div id="evening-time-row" class="time-row">
            <label class="field-label" for="set-evening-time">Open again at</label>
            <input id="set-evening-time" type="time" class="text-input time-input" value="22:00" />
          </div>
        </div>

        <button id="btn-save-settings" class="start-btn">Save</button>
      </div>
    </div>

    <div id="tooltip" class="tooltip hidden" role="status"></div>

    <script src="renderer.js"></script>
  </body>
</html>
