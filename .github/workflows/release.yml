# Builds the Windows installer on a clean machine and attaches it to a
# GitHub Release. Triggered by pushing a version tag:
#
#     git tag v1.0.1 && git push origin v1.0.1
#
# Building on a fresh runner is the point: it proves the repo alone is
# enough to produce the app, with nothing borrowed from your own machine.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # electron's postinstall downloads the binary; package.json allows it
      # through pnpm.onlyBuiltDependencies
      - run: pnpm install --no-frozen-lockfile

      - run: pnpm dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          draft: true
          generate_release_notes: true
